<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#15343C">
<title>Lâmpada</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lâmpada">
<link rel="stylesheet" href="fontes.css">
<style>
:root{
  /* Lâmpada: papel de linho, tinta de ardósia, noite azul-petróleo e uma única chama âmbar.
     Layout: uma coluna de celular; a faixa noturna com a chama é o único momento ousado, o resto é quieto. */
  --linho:#ECEEE8;
  --papel:#FAFBF8;
  --tinta:#1E2B2F;
  --tinta-2:#56656A;
  --noite:#15343C;
  --chama:#EFA92E;
  --chama-txt:#8A5A06;
  --oliva:#5F7A4E;
  --linha:#D3D9D1;
  --fora:#D5DBD2;
  --sombra:0 1px 0 rgba(30,43,47,.06);
  --hl0:#F6DE74; --hl1:#C3E5B5; --hl2:#BDD9F3; --hl3:#F6C6D2; --hl4:#F8CD9C;
  --f-display:'Literata',Georgia,'Times New Roman',serif;
  --f-ui:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
#app[data-app-theme="escuro"]{
  --linho:#0F1D21; --papel:#15272C; --tinta:#E4E9E2; --tinta-2:#9AA9A6; --noite:#0A262D;
  --chama-txt:#F2B851; --oliva:#8DAE77; --linha:#27403F; --fora:#071013;
  --hl0:rgba(236,196,58,.42); --hl1:rgba(120,190,100,.38); --hl2:rgba(100,160,230,.38); --hl3:rgba(230,120,150,.38); --hl4:rgba(240,150,70,.42);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fora);font-family:var(--f-ui);color:#1E2B2F;-webkit-font-smoothing:antialiased}
body.escuro{background:#071013}
#app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--linho);color:var(--tinta);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){
  body{padding:20px 0}
  #app{height:calc(100% - 0px);border-radius:28px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 24px 60px rgba(10,30,35,.18)}
}
#scr{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;outline:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--chama);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:18px;height:18px}
.num{font-variant-numeric:tabular-nums}

/* barra de abas */
#tabs{display:flex;border-top:1px solid var(--linha);background:var(--papel);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#tabs.off{display:none}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;color:var(--tinta-2);border-radius:12px}
#tabs button[aria-current="page"]{color:var(--tinta)}
#tabs button[aria-current="page"] .ic{stroke:var(--chama-txt)}
#app[data-app-theme="escuro"] #tabs button[aria-current="page"] .ic{stroke:var(--chama)}

/* estrutura comum */
.pad{padding:16px 18px 28px;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 14px;position:sticky;top:0;z-index:5;background:var(--linho);border-bottom:1px solid transparent}
.topbar.line{border-bottom-color:var(--linha)}
.topbar h1{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;flex:none}
.iconbtn:hover{background:rgba(127,140,140,.12)}
.screen-title{font-family:var(--f-display);font-size:30px;font-weight:600;letter-spacing:-.01em;padding:8px 2px 0}
.sub{color:var(--tinta-2);font-size:14px;line-height:1.45}
.sec-h{font-size:15px;font-weight:600;margin-top:6px}
.btn-chama{background:var(--chama);color:#1E2B2F;font-weight:600;font-size:16px;padding:14px 18px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-chama:hover{filter:brightness(1.05)}
.btn-chama:disabled{opacity:.45;cursor:not-allowed}
.btn-sec{border:1px solid var(--linha);background:var(--papel);font-weight:600;font-size:15px;padding:11px 16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-ghost{color:var(--tinta);font-weight:600;font-size:15px;padding:12px 14px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--linha)}
.wide{width:100%;justify-content:center}
.lnk{color:var(--chama-txt);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--linha);background:var(--papel);border-radius:999px;padding:7px 13px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--linho);border-color:var(--tinta)}
.seg{display:flex;background:rgba(127,140,140,.14);border-radius:12px;padding:3px}
.seg button{flex:1;padding:8px 6px;font-size:14px;font-weight:500;border-radius:9px;color:var(--tinta-2)}
.seg button[aria-pressed="true"]{background:var(--papel);color:var(--tinta);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--tinta-2)}
.inp{border:1px solid var(--linha);background:var(--papel);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.row{display:flex;gap:10px;align-items:center}
.notice{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.45;color:var(--tinta-2)}
.notice p{flex:1}
.empty{border:1px dashed var(--linha);border-radius:14px;padding:22px 18px;text-align:center;color:var(--tinta-2);font-size:14.5px;line-height:1.5}

/* hoje: a faixa da chama */
.hero{background:var(--noite);color:#F2F1EA;margin:0 0 4px;padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.h-date{font-size:14px;color:#B9C8C6}
.h-flame{display:flex;align-items:center;gap:16px;margin:14px 0 18px;position:relative}
.flame-wrap{position:relative;width:76px;height:76px;flex:none;display:grid;place-items:center}
.glow{position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(circle,rgba(239,169,46,.55) 0%,rgba(239,169,46,.18) 38%,rgba(239,169,46,0) 70%);transform:scale(var(--g,1))}
.flame{width:44px;height:58px;position:relative}
@media (prefers-reduced-motion:no-preference){
  .glow{animation:respira 5s ease-in-out infinite}
  @keyframes respira{0%,100%{opacity:.85}50%{opacity:1}}
}
.h-streak{display:flex;flex-direction:column}
.h-streak strong{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1}
.h-streak span{font-size:15px;color:#D9E2DF}
.h-streak small{font-size:13px;color:#F2C46B;margin-top:4px}
.h-day{font-size:14px;color:#B9C8C6}
.h-ref{font-family:var(--f-display);font-size:34px;line-height:1.12;font-weight:600;letter-spacing:-.01em;color:#FFFFFF}
.h-meta{font-size:15px;color:#CAD6D3;margin-bottom:12px}
.h-acts{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn-sec{background:transparent;border-color:rgba(255,255,255,.28);color:#F2F1EA}
.h-done{display:flex;gap:8px;align-items:center;color:#BFE0A8;font-weight:600;font-size:15px;margin-bottom:10px}
.h-prog{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:13px;color:#B9C8C6}
.h-prog .bar{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.h-prog .bar i{display:block;height:100%;background:var(--chama);border-radius:4px}
.hero .note-grace{font-size:13px;color:#B9C8C6}
.pend{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--papel);border:1px solid var(--linha);border-left:4px solid var(--chama);border-radius:12px;padding:12px 14px}
.pend div{flex:1;display:flex;flex-direction:column;gap:2px}
.pend strong{font-size:15px}
.pend span{font-size:13.5px;color:var(--tinta-2)}
.pcard{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pcard .pc-top{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--tinta-2)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pcard h3{font-family:var(--f-display);font-size:21px;font-weight:600}
.pcard .row{justify-content:space-between}
.tag-ok{color:var(--oliva);font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.tag-warn{color:var(--chama-txt);font-weight:600;font-size:14px}

/* cronograma */
.daylist{display:flex;flex-direction:column;border-top:1px solid var(--linha)}
.dayrow{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--linha)}
.dayrow .dn{width:46px;flex:none;font-size:13px;color:var(--tinta-2);line-height:1.25}
.dayrow .dn b{display:block;color:var(--tinta);font-size:15px}
.dayrow .dl{flex:1;min-width:0;text-align:left;font-size:15px;line-height:1.35}
.dayrow .dl small{display:block;color:var(--tinta-2);font-size:13px}
.dayrow.today{background:rgba(239,169,46,.10)}
.st{font-size:12.5px;font-weight:600;padding:4px 8px;border-radius:999px;white-space:nowrap}
.st.ok{color:var(--oliva);background:rgba(95,122,78,.12)}
.st.pe{color:var(--chama-txt);background:rgba(239,169,46,.16)}
.st.de{color:var(--tinta-2);border:1px dashed var(--linha)}
.mini{font-size:13px;font-weight:600;border:1px solid var(--linha);border-radius:999px;padding:6px 10px;background:var(--papel);white-space:nowrap}

/* leitor */
.reader{min-height:100%;background:var(--papel)}
.reader.sepia{--papel:#F3EBDC;--tinta:#3A2F23;--tinta-2:#7A6A57;--linha:#E0D3BD;background:#F3EBDC;color:#3A2F23}
.reader.escuro{--papel:#121F23;--tinta:#DCE3DE;--tinta-2:#93A29F;--linha:#26393A;background:#121F23;color:#DCE3DE;
  --hl0:rgba(236,196,58,.40); --hl1:rgba(120,190,100,.36); --hl2:rgba(100,160,230,.36); --hl3:rgba(230,120,150,.36); --hl4:rgba(240,150,70,.40)}
.reader .topbar{background:var(--papel);border-bottom-color:var(--linha)}
.vpill{border:1px solid var(--linha);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;letter-spacing:.02em}
.cap{padding:8px 22px 6px;max-width:40em}
.cap h2{font-family:var(--f-display);font-weight:600;font-size:24px;margin:22px 0 10px}
.txt{font-family:var(--f-display);font-size:var(--fs,19px);line-height:1.75}
.v{cursor:pointer;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:1px 0}
.v sup{font-family:var(--f-ui);font-size:.58em;font-weight:600;color:var(--tinta-2);margin-right:3px;vertical-align:.5em;line-height:0}
.v.h0{background:var(--hl0)} .v.h1{background:var(--hl1)} .v.h2{background:var(--hl2)} .v.h3{background:var(--hl3)} .v.h4{background:var(--hl4)}
.v.sel{text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--chama-txt);text-decoration-thickness:2px;text-underline-offset:5px;background-color:rgba(239,169,46,.14)}
.v.flash{outline:2px solid var(--chama);outline-offset:2px}
.v .mk{display:inline-block;vertical-align:-2px;margin-left:3px;color:var(--chama-txt)}
.v .mk svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.capdone{margin:16px 0 8px;display:flex;justify-content:flex-start}
.btn-done{border:1.5px solid var(--tinta);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.btn-done[aria-pressed="true"]{border-color:var(--oliva);color:var(--oliva);background:rgba(95,122,78,.10)}
.endday{padding:20px 22px 120px;display:flex;flex-direction:column;gap:10px}
.actbar{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--papel);border-top:1px solid var(--linha);padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;box-shadow:0 -8px 24px rgba(10,30,35,.08)}
.actbar .acts{display:flex;justify-content:space-between;gap:2px}
.actbar .acts button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;padding:6px 0;border-radius:10px}
.actbar .acts button:hover{background:rgba(127,140,140,.12)}
.actbar .selinfo{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;color:var(--tinta-2);padding:0 6px}
.swatches{display:flex;gap:10px;align-items:center;padding:0 6px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center}
.sw[aria-pressed="true"]{border-color:var(--tinta)}
.sw0{background:#F6DE74}.sw1{background:#C3E5B5}.sw2{background:#BDD9F3}.sw3{background:#F6C6D2}.sw4{background:#F8CD9C}
.chapnav{display:flex;justify-content:space-between;padding:10px 22px 110px}

/* folhas */
#layer{position:absolute;inset:0;z-index:40;pointer-events:none}
#layer.on{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(8,20,24,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--papel);color:var(--tinta);border-radius:20px 20px 0 0;max-height:88%;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet-x{position:absolute;top:8px;right:8px}
.sheet h2{padding-right:40px}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--linha);align-self:center;margin-bottom:4px}
.sheet h2{font-family:var(--f-display);font-size:22px;font-weight:600}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--linha);border-radius:12px;padding:12px 14px;background:var(--papel)}
.opt strong{font-size:15.5px}
.opt span{font-size:13.5px;color:var(--tinta-2);line-height:1.4}
.opt[aria-pressed="true"]{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:sobe .22s ease-out}
  @keyframes sobe{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
.full{position:absolute;inset:0;background:var(--linho);overflow:auto;display:flex;flex-direction:column}
#toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:var(--tinta);color:var(--linho);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86%;text-align:center}
#toast.on{opacity:1}

/* fechamento */
.fx-head{background:var(--noite);color:#F2F1EA;padding:22px 20px 26px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.fx-head h2{font-family:var(--f-display);font-size:28px;font-weight:600}
.fx-head p{color:#CAD6D3;font-size:15px}
.fx-streak{display:flex;align-items:center;gap:14px;margin-top:10px}
.fx-streak strong{font-family:var(--f-display);font-size:34px}
.ptlist{display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.ptlist div{display:flex;justify-content:space-between}
.ptlist .tot{border-top:1px solid var(--linha);padding-top:8px;font-weight:700}
.badge-new{display:flex;gap:12px;align-items:center;background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:12px}
.medal{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(239,169,46,.18);color:var(--chama-txt);flex:none}
.medal svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.medal.off{background:transparent;border:1.5px dashed var(--linha);color:var(--tinta-2)}
.versebox{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.versebox q{font-family:var(--f-display);font-size:17px;line-height:1.55;quotes:none}
.versebox small{color:var(--tinta-2);font-size:13px}

/* editor de imagem */
.ed-prev{background:#C9CFC6;padding:14px;display:flex;justify-content:center;position:sticky;top:65px;z-index:4}
#app[data-app-theme="escuro"] .ed-prev{background:#0A1518}
.ed-prev canvas{max-height:38vh;max-width:100%;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);background:#fff}
.tpls{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.tpl{flex:none;width:64px;display:flex;flex-direction:column;gap:5px;align-items:center;font-size:12px;color:var(--tinta-2)}
.tpl canvas{width:56px;height:76px;border-radius:8px;border:2px solid transparent}
.tpl[aria-pressed="true"] canvas{border-color:var(--tinta)}
.colors{display:flex;gap:10px}
.cc{width:34px;height:34px;border-radius:50%;border:1px solid var(--linha)}
.cc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--papel),0 0 0 4px var(--tinta)}
.sticky-foot{position:sticky;bottom:0;background:var(--linho);padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--linha);display:flex;gap:10px}
.warnline{font-size:13px;color:var(--chama-txt)}
.outimg{width:100%;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--linha);font-size:15px}
.switch:last-child{border-bottom:0}
.tg{width:46px;height:28px;border-radius:999px;background:var(--linha);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.tg[aria-checked="true"]{background:var(--oliva)}
.tg[aria-checked="true"]::after{left:21px}

/* assistente */
.steps{display:flex;gap:6px;padding:0 18px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--linha)}
.steps i.on{background:var(--chama)}
.grp{display:flex;flex-direction:column}
.grp>h4{font-size:13px;font-weight:600;color:var(--tinta-2);margin:14px 0 6px}
.bk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--linha)}
.ck{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--tinta-2);display:grid;place-items:center;flex:none}
.ck[data-s="all"]{background:var(--tinta);border-color:var(--tinta);color:var(--linho)}
.ck[data-s="part"]{border-color:var(--tinta)}
.ck[data-s="part"]::after{content:"";width:10px;height:2px;background:var(--tinta);border-radius:2px}
.bk .bn{flex:1;text-align:left;font-size:15.5px}
.bk .bn small{color:var(--tinta-2);font-size:13px;margin-left:6px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;padding:10px 0 14px}
.chgrid button{border:1px solid var(--linha);border-radius:9px;padding:9px 0;font-size:14px;background:var(--papel)}
.chgrid button[aria-pressed="true"]{background:var(--tinta);color:var(--linho);border-color:var(--tinta)}
.wiz{min-height:100%;display:flex;flex-direction:column}
.wiz>.pad{flex:1}
.sumbar{position:sticky;bottom:0;background:var(--linho);border-top:1px solid var(--linha);padding:12px 18px calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
.sumbar .sb{flex:1;font-size:13.5px;color:var(--tinta-2);line-height:1.35}
.sumbar .sb b{color:var(--tinta);font-size:15px;display:block}
.model{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px;border:1px solid var(--linha);border-radius:14px;background:var(--papel)}
.model strong{font-family:var(--f-display);font-size:19px;font-weight:600}
.model span{font-size:13.5px;color:var(--tinta-2)}
.model[aria-pressed="true"]{border-color:var(--tinta);box-shadow:inset 0 0 0 1px var(--tinta)}
.wk{display:flex;gap:6px}
.wk button{flex:1;border:1px solid var(--linha);border-radius:10px;padding:9px 0;font-size:13.5px;background:var(--papel)}
.wk button[aria-pressed="true"]{background:var(--tinta);color:var(--linho);border-color:var(--tinta)}
.feedback{background:var(--papel);border:1px solid var(--linha);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.feedback b{font-family:var(--f-display);font-size:22px;font-weight:600}

/* progresso */
.ringrow{display:flex;gap:18px;align-items:center;background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:16px}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rv b{font-family:var(--f-display);font-size:28px;font-weight:600;display:block;line-height:1}
.ring .rv small{font-size:12px;color:var(--tinta-2)}
.ringinfo{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--tinta-2)}
.ringinfo strong{color:var(--tinta);font-size:16px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;width:max-content}
.pill.ok{background:rgba(95,122,78,.14);color:var(--oliva)}
.pill.ah{background:rgba(47,127,134,.14);color:#2F7F86}
.pill.at{background:rgba(239,169,46,.18);color:var(--chama-txt)}
#app[data-app-theme="escuro"] .pill.ah{color:#7CC3C9}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.stat{border-top:1px solid var(--linha);padding:12px 0 10px;display:flex;flex-direction:column;gap:3px}
.stat span{font-size:13px;color:var(--tinta-2)}
.stat b{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.15}
.stat small{font-size:12.5px;color:var(--tinta-2)}
.chartbox{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:14px 12px 8px}
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--tinta-2);flex-wrap:wrap;padding:6px 4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto}
.cal i{width:18px;height:18px;border-radius:4px;display:block}
.cal .r{background:var(--chama)}
.cal .m{background:var(--linha)}
.cal .d{border:1px dashed var(--linha)}
.cal .f{background:transparent;border:1px solid rgba(127,140,140,.18)}
.cal .t{outline:2px solid var(--tinta);outline-offset:1px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.books span{font-size:12px;font-weight:600;text-align:center;padding:8px 0;border-radius:7px;border:1px solid var(--linha);color:var(--tinta-2)}
.books span.done{background:var(--oliva);border-color:var(--oliva);color:#fff}
.lvl{background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.lvl .lv-top{display:flex;justify-content:space-between;align-items:baseline}
.lvl .lv-top b{font-family:var(--f-display);font-size:22px;font-weight:600}
.lvbar{height:8px;border-radius:8px;background:rgba(127,140,140,.18);overflow:hidden}
.lvbar i{display:block;height:100%;background:var(--oliva);border-radius:8px}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ach{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.3}
.ach b{display:block;font-size:14px}
.ach span{color:var(--tinta-2)}
.ach.off b{color:var(--tinta-2)}

/* anotações */
.item{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 2px;border-bottom:1px solid var(--linha)}
.item .sq{width:12px;height:36px;border-radius:4px;flex:none}
.item .it{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item .it b{font-size:15px}
.item .it p{font-family:var(--f-display);font-size:15px;line-height:1.45;color:var(--tinta);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item .it small{font-size:12.5px;color:var(--tinta-2)}
.listrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--linha);width:100%;text-align:left;font-size:15.5px}
.listrow span{flex:1}
.listrow small{color:var(--tinta-2);font-size:13px}
.imgs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.imgs button canvas{width:100%;border-radius:8px;display:block}

/* versão pessoal: texto real, versões importadas, backup */
.tit{font-family:var(--f-ui);font-size:15px;font-weight:700;line-height:1.35;color:var(--tinta);margin:20px 0 8px;letter-spacing:.005em}
.cap h2+.tit{margin-top:4px}
.v.aus{color:var(--tinta-2)}
.credito{font-size:12.5px;color:var(--tinta-2);line-height:1.5;padding:18px 22px 0;max-width:40em}
.loading{padding:28px 0;color:var(--tinta-2);font-family:var(--f-ui);font-size:15px}
.vrow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--linha);width:100%;text-align:left}
.vrow .sg{min-width:56px;font-weight:700;font-size:13.5px;letter-spacing:.02em;border:1px solid var(--linha);border-radius:999px;padding:5px 8px;text-align:center}
.vrow .vn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:15px}
.vrow .vn small{color:var(--tinta-2);font-size:12.5px}
.danger{color:#A33A3A}
.btn-sec.danger{border-color:rgba(163,58,58,.35)}
#app[data-app-theme="escuro"] .danger{color:#E58C8C}
.btn-chama.danger-fill{background:#B54A4A;color:#fff}
.hidden-file{position:fixed;left:-9999px;width:1px;height:1px;opacity:0}
.res{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.4}
.res .ic{margin-top:1px}
.res.ok .ic{stroke:var(--oliva)}
.res.er .ic{stroke:#B54A4A}

/* leitura da nota e imagem ampliada */
.nota-txt{font-family:var(--f-display);font-size:17px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.viewer{position:absolute;inset:0;background:#071013;color:#F2F1EA;display:flex;flex-direction:column}
.vw-top{display:flex;justify-content:flex-end;padding:calc(6px + env(safe-area-inset-top)) 6px 0}
.vw-img{flex:1;min-height:0;position:relative}
.vw-img canvas{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain}
.vw-note{font-size:13px;line-height:1.4;color:#B9C8C6;text-align:center;padding:6px 18px 0}
.vw-acts{display:flex;gap:2px;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
.vw-acts button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;padding:8px 0;border-radius:10px;color:#F2F1EA}
.opt.danger{border-color:rgba(163,58,58,.35)}
/* árvore do nível: sem animação, tudo já aparece no estado final */
.lvl{cursor:pointer}
.tree{position:absolute;inset:0;background:var(--linho);color:var(--tinta);overflow:auto}
.tree-x{position:absolute;z-index:2;top:calc(8px + env(safe-area-inset-top));right:8px;background:rgba(10,30,35,.55);color:#fff;border-radius:50%}
.tree-x:hover{background:rgba(10,30,35,.7)}
.tr-stage{position:relative;width:100%;aspect-ratio:320/400;background:#1B3A42}
.tr-stage canvas,.tr-dim,.tr-over{position:absolute;inset:0;width:100%;height:100%}
.tr-dim{background:#16303C}
.tr-dots{display:flex;align-items:center;justify-content:space-between;padding:4px 2px}
.tr-dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--linha);display:block}
.tr-dots i.on{background:var(--oliva);border-color:var(--oliva)}
.tr-dots i.now{background:var(--chama);border-color:var(--chama);box-shadow:0 0 0 3px rgba(239,169,46,.28)}
.tr-seedgo,.tr-dim{opacity:0}
@media (prefers-reduced-motion:no-preference){
  .tr-seedgo{animation:trseed 1.1s ease-in forwards}
  @keyframes trseed{0%,45%{opacity:1}100%{opacity:0}}
  .tr-dim{animation:trdim 3s ease-out forwards}
  @keyframes trdim{from{opacity:.72}to{opacity:0}}
}
.ed-prev canvas{cursor:zoom-in}
.ed-zoom{position:absolute;right:10px;bottom:10px;background:rgba(10,30,35,.72);color:#fff;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px}

/* Livro de uma versão: devolve o livro se já está na memória; senão começa a carregar e devolve null (a tela se refaz ao terminar). */
function bookOf(sig,b){
  const m=BIB.meta[sig];if(!m||!DB||!m.caps[b])return {missing:true};
  const k=sig+'|'+b;const x=BCACHE.get(k);if(x){BCACHE.delete(k);BCACHE.set(k,x);return x;}
  if(!LOADING.has(k)){LOADING.add(k);
    idbReq(DB.transaction('livros').objectStore('livros').get(k)).then(r=>{BCACHE.set(k,r||{missing:true});while(BCACHE.size>48)BCACHE.delete(BCACHE.keys().next().value);})
      .catch(()=>BCACHE.set(k,{missing:true})).finally(()=>{LOADING.delete(k);refreshSoon();});}
  return null;
}

/* Versículos da versão no capítulo c cujo número de referência cai entre v1 e v2.
   Cada item: vv (número na versão), cv (número de referência), lab (rótulo, como "9-10" nos versículos unidos) e txt. */
function verses(sig,b,c,v1,v2){
  const bk=bookOf(sig,b);if(!bk)return null;if(bk.missing||!bk.capitulos[c-1])return [];
  const ch=bk.capitulos[c-1],un=bk.unidos||{};const cover={};
  for(const [key,end] of Object.entries(un)){const [cc,s]=key.split(':').map(Number);if(cc===c)for(let x=s+1;x<=end;x++)cover[x]=s;}
  const out=[],seen=new Set();
  const item=vv=>{const end=un[c+':'+vv];const o={vv,cv:canon(sig,b,c,vv),txt:ch[vv-1]||'',lab:String(vv)};if(end>vv){o.lab=`${vv}-${end}`;o.end=end;}return o;};
  for(let vv=1;vv<=ch.length;vv++){const cv=canon(sig,b,c,vv);if(cv<v1||cv>v2)continue;
    const t=ch[vv-1]||'';
    if(!t.trim()&&cover[vv]){const s=cover[vv];if(!seen.has(s)){seen.add(s);out.push(item(s));}continue;}
    if(seen.has(vv))continue;seen.add(vv);out.push(item(vv));}
  return out;
}

function refresh(){

  const vals=[...document.querySelectorAll('#app input[id],#app textarea[id]')].filter(e=>e.type!=='file').map(e=>[e.id,e.value]);

  if(id){const e=document.getElementById(id);if(e&&e!==document.activeElement){try{e.focus({preventScroll:true});if(s0!=null)e.setSelectionRange(s0,s1);}catch(_){}}}
}

function unitsFromBooks(list){const us=[];for(const b of list)for(let c=1;c<=nC(b);c++)us.push({b,c,v1:1,v2:nV(b,c)});return us;}
const rangeA=(a,b)=>Array.from({length:b-a},(_,i)=>a+i);
function planDates(start,dur,wk,rests,units){
  if(!wk.some(Boolean))return [];
  const ok=d=>wk[wd(d)]&&!rests.includes(d);
  if(dur.t==='prazo'){
    const n=Math.max(1,Math.floor(dur.n)||1);let end;
    if(dur.u==='dias')end=addD(start,n-1);else if(dur.u==='semanas')end=addD(start,n*7-1);
    else{const d=pd(start);d.setMonth(d.getMonth()+n);d.setDate(d.getDate()-1);end=dk(d);}
    const out=[];for(let d=start;d<=end;d=addD(d,1))if(ok(d))out.push(d);return out;
  }
  const V=units.reduce((s,u)=>s+uv(u),0);
  let D=dur.ru==='cap'?Math.ceil(units.length/Math.max(.1,dur.rn||1)):Math.ceil(V/Math.max(1,(dur.rn||1)*60/SECS_PER_V));
  D=Math.max(1,D);const out=[];let d=start,g=0;while(out.length<D&&g<5000){if(ok(d))out.push(d);d=addD(d,1);g++;}return out;
}
function distribute(us,dates){
  const D=Math.min(dates.length,us.length);if(!D)return [];
  const V=us.reduce((s,u)=>s+uv(u),0),T=V/D;const days=[];let i=0,acc=0;
  for(let k=1;k<=D;k++){
    const left=D-k,day=[us[i]];acc+=uv(us[i]);i++;
    if(k===D){while(i<us.length){day.push(us[i]);acc+=uv(us[i]);i++;}}
    else while(i<us.length&&us.length-i>left){const nx=acc+uv(us[i]);if(Math.abs(nx-k*T)<Math.abs(acc-k*T)){day.push(us[i]);acc=nx;i++;}else break;}
    days.push({id:uid(),date:dates[k-1],units:day});
  }
  return days;
}
function schedule(units,dates){
  if(!units.length||!dates.length)return {days:[],T:0,cut:false,split:0};
  const V=units.reduce((s,u)=>s+uv(u),0),T0=V/dates.length;const us=[];let split=0;
  for(const u of units){const n=uv(u);if(n>1.5*T0&&n>1){const k=Math.ceil(n/T0),sz=Math.ceil(n/k);split++;for(let a=u.v1;a<=u.v2;a+=sz)us.push({b:u.b,c:u.c,v1:a,v2:Math.min(u.v2,a+sz-1)});}else us.push({...u});}
  const days=distribute(us,dates);
  return {days,T:V/days.length,cut:days.length<dates.length,split};
}

  return {id:uid(),name:o.name,version:o.version,color:o.color||0,start:o.start,wk:o.wk,rests:o.rests||[],days:sc.days,reminder:o.reminder||'06:30',created:TODAY,paused:false};
}

  ['arcoiris','Profundidade','Arco-íris','Usar as 5 cores de destaque',C=>new Set(Object.values(S.hl)).size>=5],
  ['emdia','Profundidade','Em dia','Zerar as pendências de um plano',C=>S.catchups.length>=1]
];
function isReadingDay(d){return S.plans.some(p=>!p.paused&&p.start<=d&&d<=planEnd(p)&&p.wk[wd(d)]&&!p.rests.includes(d));}
let CC=null;
function compute(){
  const C={};
  C.idx=new Map();for(const r of S.reads)C.idx.set(r.plan+'|'+r.day+'|'+r.key,r);
  const vf=new Map();
  for(const r of S.reads)for(let v=r.v1;v<=r.v2;v++){const k=r.b*1e6+r.c*1e3+v,p=vf.get(k);if(p===undefined||r.refDate<p)vf.set(k,r.refDate);}
  C.book=[];let cov=0;
  for(let b=0;b<66;b++){let n=0,t=0,last='';for(let c=1;c<=nC(b);c++)for(let v=1;v<=nV(b,c);v++){t++;const d=vf.get(b*1e6+c*1e3+v);if(d){n++;if(d>last)last=d;}}C.book.push({n,t,done:n===t,date:n===t?last:null});cov+=n;}
  C.coverage=cov/TOTAL_V;C.booksDone=C.book.filter(x=>x.done).length;
  C.groupsDone=GRP.filter(g=>rangeA(g[0],g[1]).every(b=>C.book[b].done)).map(g=>g[2]);
  C.plan={};
  for(const p of S.plans){
    let tot=0,rd=0;const dayDone=[];
    p.days.forEach((d,i)=>{let all=true,last='';for(const u of d.units){const n=uv(u);tot+=n;const r=C.idx.get(p.id+'|'+d.id+'|'+ukey(u));if(r){rd+=n;if(r.refDate>last)last=r.refDate;}else all=false;}dayDone[i]=all&&d.units.length?last:null;});
    const rs=S.reads.filter(r=>r.plan===p.id).sort((a,b)=>a.refDate<b.refDate?-1:a.refDate>b.refDate?1:0);let cum=0;const ms={};
    for(const r of rs){cum+=uv(r);for(const q of [25,50,75,100])if(!ms[q]&&tot&&cum/tot*100>=q-1e-9)ms[q]=r.refDate;}
    C.plan[p.id]={tot,rd,pct:tot?rd/tot:0,dayDone,ms};
  }
  const rdates=new Set(S.reads.filter(r=>!r.late).map(r=>r.refDate));C.rdates=rdates;
  let start=null;for(const p of S.plans)if(!start||p.start<start)start=p.start;
  for(const r of S.reads)if(!start||r.refDate<start)start=r.refDate;
  let cur=0,best=0,grace=0,hadBreak=false,recomeco=false;const bonus=[],graceUsed=[];
  const hit=d=>{cur++;if(cur%7===0){bonus.push(d);grace=Math.min(2,grace+1);}if(hadBreak&&cur>=7)recomeco=true;};
  if(start){for(let d=start;d<TODAY;d=addD(d,1)){if(rdates.has(d))hit(d);else if(isReadingDay(d)){if(grace>0){grace--;graceUsed.push(d);}else{if(cur>0)hadBreak=true;cur=0;}}best=Math.max(best,cur);}
    if(rdates.has(TODAY))hit(TODAY);best=Math.max(best,cur);}
  C.streak={cur,best,grace,bonus,graceUsed,recomeco,todayRead:rdates.has(TODAY)};
  /* pontos */
  const daily=new Map();const add=(d,k,n)=>{if(!daily.has(d))daily.set(d,{porcao:0,caps:0,notas:0,dest:0,emdia:0});daily.get(d)[k]+=n;};
  for(const p of S.plans){const pc=C.plan[p.id],seen=new Set();p.days.forEach((d,i)=>{const c=pc.dayDone[i];if(c&&d.date<=c&&!seen.has(c)){seen.add(c);add(c,'porcao',10);}});}
  const cnt=(arr)=>{const m=new Map();for(const d of arr)m.set(d,(m.get(d)||0)+1);return m;};
  for(const [d,n] of cnt(S.reads.map(r=>r.refDate)))add(d,'caps',Math.min(10,n)*2);
  for(const [d,n] of cnt(S.notes.filter(x=>x.text.trim().length>=40).map(x=>x.created)))add(d,'notas',Math.min(2,n)*5);
  for(const [d,n] of cnt([...Object.values(S.hlAt),...S.marks.map(m=>m.at)]))add(d,'dest',Math.min(5,n));
  let lastCU=null;for(const d of [...S.catchups].sort()){if(!lastCU||diffD(lastCU,d)>=7){add(d,'emdia',10);lastCU=d;}}
  let total=0;const byDay=new Map();
  for(const [d,o] of daily){const sum=o.porcao+o.caps+o.notas+o.dest+o.emdia;const t=Math.min(50,sum);byDay.set(d,{...o,sum,t});total+=t;}
  const extras=[];
  for(const d of bonus)extras.push({d,n:15,l:'Mais 7 dias de sequência'});
  C.book.forEach((x,b)=>{if(x.done)extras.push({d:x.date,n:25,l:`${BK[b][0]} concluído`});});
  for(const p of S.plans){const ms=C.plan[p.id].ms;for(const q of [25,50,75])if(ms[q])extras.push({d:ms[q],n:30,l:`${q}% de ${p.name}`});if(ms[100])extras.push({d:ms[100],n:100,l:`${p.name} concluído`});}
  for(const e of extras)total+=e.n;
  total+=S.ptsKept||0;
  C.points={total,byDay,extras,today:byDay.get(TODAY)||{porcao:0,caps:0,notas:0,dest:0,emdia:0,sum:0,t:0},todayExtras:extras.filter(e=>e.d===TODAY)};
  let li=0;for(let i=0;i<LV.length;i++)if(total>=LV[i][1])li=i;C.level={i:li,name:LV[li][0],min:LV[li][1],next:LV[li+1]?LV[li+1]:null};
  C.ach=new Set(ACH.filter(a=>a[4](C)).map(a=>a[0]));
  for(const a of C.ach)if(!S.achAt[a])S.achAt[a]=TODAY;
  const timed=S.reads.filter(r=>r.secs);if(timed.length>=3){const sv=timed.reduce((s,r)=>s+r.secs,0)/timed.reduce((s,r)=>s+uv(r),0);if(sv>2&&sv<30)SECS_PER_V=sv;}
  return C;
}
function pending(p){if(p.paused)return [];const pc=CC.plan[p.id];return p.days.filter((d,i)=>d.date<TODAY&&!pc.dayDone[i]);}

function noteAt(b,c,v){return S.notes.find(n=>n.b===b&&n.c===c&&v>=n.v1&&v<=n.v2);}
function markAt(b,c,v){return S.marks.find(m=>m.b===b&&m.c===c&&m.v===v);}
/* x: versículo devolvido por verses(); a chave de destaques, notas e seleção usa a numeração de referência (x.cv). */
function verseHTML(b,c,x){const k=`${b}.${c}.${x.cv}`;const h=S.hl[k];const n=noteAt(b,c,x.cv);const m=markAt(b,c,x.cv);const empty=!x.txt.trim();

function chapterHTML(ver,b,c,v1,v2){
  if(!hasVer(ver))return `<div class="empty" style="margin:8px 0">Nenhuma Bíblia importada neste celular.<br><button class="btn-chama" style="margin-top:12px" data-a="importBib">Importar Bíblia</button></div>`;
  const vs=verses(ver,b,c,v1,v2);
  if(vs===null)return `<p class="loading">Carregando o texto…</p>`;
  if(!vs.length)return `<p class="sub" style="padding:8px 0">Este trecho não está no arquivo da versão ${esc(ver)}. Troque a versão no botão ${esc(ver)} acima.</p>`;
  const bk=bookOf(ver,b);const tits=S.settings.titles!==false&&bk&&bk.titulos?bk.titulos:{};
  let h='',open=false;
  for(const x of vs){const tt=tits[c+':'+x.vv];
    if(tt){if(open){h+='</p>';open=false;}h+=String(tt).split(' / ').map(t=>`<h3 class="tit">${esc(t)}</h3>`).join('');}
    if(!open){h+='<p class="txt">';open=true;}

}

function planStats(p){

const ABBR=(()=>{const m=new Map();const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[\s.]/g,'');
  BK.forEach(([n,a],i)=>{m.set(norm(n),i);m.set(norm(a),i);});
  m.set('jo',42);m.set('sal',18);m.set('salmo',18);m.set('ps',18);m.set('ex',1);m.set('apoc',65);m.set('cantares',21);m.set('ct',21);m.set('fil',49);m.set('fl',49);m.set('job',17);
  return {get:(raw)=>{const r=raw.toLowerCase().replace(/[\s.]/g,'');if(r==='jó')return 17;return m.get(norm(raw));}};})();
function parseRefs(txt){
  const ok=[],bad=[];
  for(const part of txt.split(/[;\n]+/).map(s=>s.trim()).filter(Boolean)){
    const m=part.match(/^([1-3]?\s*[A-Za-zÀ-ÿ]+\.?)\s*(\d+)?(?:\s*:\s*(\d+)(?:\s*[-–]\s*(\d+))?)?(?:\s*[-–]\s*(\d+))?$/);
    if(!m){bad.push(part);continue;}const b=ABBR.get(m[1]);if(b===undefined){bad.push(part);continue;}
    const c=m[2]?+m[2]:null;
    if(!c){ok.push({b,chs:rangeA(1,nC(b)+1)});continue;}
    if(c<1||c>nC(b)){bad.push(part);continue;}
    if(m[3]){const v1=+m[3],v2=m[4]?+m[4]:v1;if(v1<1||v2>nV(b,c)||v2<v1){bad.push(part);continue;}ok.push({b,chs:[c],rng:[c,v1,v2]});continue;}
    const c2=m[5]?Math.min(+m[5],nC(b)):c;ok.push({b,chs:rangeA(c,c2+1)});
  }
  return {ok,bad};
}

function wrapLines(ctx,text,maxW){const words=text.split(/\s+/);const lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}

function drawVerse(cv,o){

  return {tooLong,fixed:textColorFor(o.tpl,o.color).fixed};
}

/* ---------- Cartão de progresso ---------- */
const PITEMS=[['dias','Dias concluídos'],['seq','Sequência atual'],['livros','Livros concluídos'],['caps','Capítulos lidos'],['cal','Calendário de 12 semanas'],['nivel','Nível'],['conq','Conquista recente'],['vers','Um versículo do período']];
function progData(p){
  const pc=CC.plan[p.id];const s=planStats(p);const di=curDay(p);
  const booksIn=[...new Set(p.days.flatMap(d=>d.units.map(u=>u.b)))].filter(b=>CC.book[b].done);
  const chs=new Set(S.reads.filter(r=>r.plan===p.id).map(r=>r.b+'.'+r.c)).size;
  const recentAch=Object.entries(S.achAt).filter(([k])=>CC.ach.has(k)).sort((a,b)=>a[1]<b[1]?1:-1)[0];
  const lastHl=Object.entries(S.hlAt).sort((a,b)=>a[1]<b[1]?1:-1)[0];
  return {pct:Math.floor(pc.pct*100),dayNum:di>=0?di+1:s.daysDone,days:p.days.length,daysDone:s.daysDone,seq:CC.streak.cur,books:booksIn.map(b=>BK[b][0]),chs,level:CC.level.name,ach:recentAch?ACH.find(a=>a[0]===recentAch[0])[2]:null,vers:lastHl?(()=>{const [b,c,v]=lastHl[0].split('.').map(Number);return refStr(b,c,v);})():null};
}
function progText(p,items){
  const d=progData(p);const parts=[`Plano ${p.name}: ${d.pct}% concluído (dia ${d.dayNum} de ${d.days}).`];
  if(items.seq)parts.push(`Sequência de ${d.seq} ${pl(d.seq,'dia','dias')}.`);
  if(items.livros&&d.books.length)parts.push(`Já terminei ${d.books.length>1?d.books.slice(0,-1).join(', ')+' e '+d.books.slice(-1):d.books[0]}.`);
  if(items.caps)parts.push(`${d.chs} capítulos lidos.`);
  if(items.nivel&&!S.settings.calm)parts.push(`Nível ${d.level}.`);
  if(items.conq&&d.ach&&!S.settings.calm)parts.push(`Conquista recente: ${d.ach}.`);
  if(items.vers&&d.vers)parts.push(`Versículo do período: ${d.vers} (${p.version}).`);
  return parts.join(' ');
}

function drawProgress(cv,c){

  ctx.font=`600 ${Math.round(rr*.6)}px ${DF}`;ctx.fillText(`${d.pct}%`,w/2,cy+rr*.16);ctx.font=`500 ${Math.round(w*.028)}px ${UIF}`;ctx.globalAlpha=.8;ctx.fillText(`dia ${d.dayNum} de ${d.days}`,w/2,cy+rr*.5);ctx.globalAlpha=1;

function suggestVerse(p,d){
  const keys=[];for(const u of d.units)for(let v=u.v1;v<=u.v2;v++)keys.push([u.b,u.c,v]);
  const hlToday=keys.filter(([b,c,v])=>S.hlAt[`${b}.${c}.${v}`]===TODAY&&S.hl[`${b}.${c}.${v}`]!=null);
  if(hlToday.length)return {k:hlToday[hlToday.length-1],why:'O versículo que você destacou hoje'};
  const nt=S.notes.filter(n=>n.created===TODAY&&keys.some(([b,c,v])=>b===n.b&&c===n.c&&v>=n.v1&&v<=n.v2));
  if(nt.length){const n=nt[nt.length-1];return {k:[n.b,n.c,n.v1],why:'Onde você escreveu uma nota hoje'};}
  const u=d.units[0];let kv=keyVerse(u.b,u.c);if(kv<u.v1||kv>u.v2)kv=u.v1;return {k:[u.b,u.c,kv],why:KEYV[u.b+'.'+u.c]===kv?'Versículo-chave do capítulo':'Um versículo da leitura de hoje'};
}

function catchUp(p){
  const pc=CC.plan[p.id];const isRead=(d,u)=>CC.idx.has(p.id+'|'+d.id+'|'+ukey(u));const T=pc.tot/p.days.length;
  const pend=p.days.filter((d,i)=>d.date<TODAY&&!pc.dayDone[i]);if(!pend.length)return;
  const moved=[];for(const d of pend){moved.push(...d.units.filter(u=>!isRead(d,u)));d.units=d.units.filter(u=>isRead(d,u));}
  p.days=p.days.filter(d=>d.units.length);
  const fut=p.days.filter(d=>d.date>=TODAY&&d.units.every(u=>!isRead(d,u)));
  if(!fut.length){p.days.push({id:uid(),date:TODAY,units:moved});}
  else{let w=Math.min(7,fut.length);const pool=()=>[...moved,...fut.slice(0,w).flatMap(d=>d.units)];const pv=()=>pool().reduce((s,u)=>s+uv(u),0);
    while(w<fut.length&&pv()>1.5*T*w)w++;const win=fut.slice(0,w);const us=pool();const ids=new Set(win.map(d=>d.id));p.days=p.days.filter(d=>!ids.has(d.id));p.days.push(...distribute(us,win.map(d=>d.date)));}
  p.days.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  S.catchups.push(TODAY);
}
function postpone(p){const pc=CC.plan[p.id];const mv=p.days.filter((d,i)=>!pc.dayDone[i]);let d=TODAY;for(const day of mv){while(!(p.wk[wd(d)]&&!p.rests.includes(d)))d=addD(d,1);day.date=d;d=addD(d,1);}p.days.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);}

/* Ao retomar, os dias da pausa viram descanso (não quebram a sequência) e as leituras não feitas andam para a frente. */
function togglePause(p){
  if(!p.paused){p.paused=true;p.pausedAt=TODAY;return;}
  const pc=CC.plan[p.id];const undone=p.days.filter((d,i)=>!pc.dayDone[i]);
  const from=p.pausedAt||(undone.length?undone[0].date:TODAY);
  if(from<TODAY){
    for(let d=from;d<TODAY;d=addD(d,1))if(!p.rests.includes(d))p.rests.push(d);
    const mv=undone.filter(d=>d.date>=from),ids=new Set(mv.map(d=>d.id));
    const used=new Set(p.days.filter(d=>!ids.has(d.id)).map(d=>d.date));
    let d=TODAY;
    for(const day of mv){if(day.date>d)d=day.date;while(!(p.wk[wd(d)]&&!p.rests.includes(d)&&!used.has(d)))d=addD(d,1);day.date=d;d=addD(d,1);}
    p.days.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  }
  p.paused=false;delete p.pausedAt;
}

/* ---------------- importação e backup ---------------- */
async function onBibFiles(files){
  if(!files||!files.length)return;
  IMPORTING=true;render();const res=[];
  for(const f of files){
    try{toast(`Importando ${f.name}…`);const txt=await f.text();let d;
      try{d=JSON.parse(txt);}catch(e){res.push([f.name,false,'Não é um arquivo JSON válido']);continue;}
      const er=validaBiblia(d);if(er){res.push([f.name,false,er]);continue;}
      const old=hasVer(normSig(d.sigla));const m=await importaBiblia(d);
      res.push([f.name,true,`${m.sigla}: ${fmtN(m.versiculos)} versículos${old?', substituiu a anterior':''}`]);
    }catch(e){res.push([f.name,false,'Erro ao guardar no celular: '+(e&&e.message||e)]);}
  }
  IMPORTING=false;
  if(!hasVer(S.settings.version))S.settings.version=okVer(...VORD);
  SHEET={t:'imp',res};render();
  storageInfo().then(()=>{if(R.v==='ajustes')refresh();});
}
async function doBackup(){
  const prev=S.settings.lastBackup;S.settings.lastBackup=TODAY;S.settings.backupSnooze=null;
  const data={formato:'lampada-backup',formatoVersao:1,geradoEm:new Date().toISOString(),app:'Lâmpada '+APPV,versoes:BIB.list.slice(),dados:S};
  const r=await shareOrDownload(new Blob([JSON.stringify(data)],{type:'application/json'}),`lampada-backup-${TODAY}.json`,'Backup do Lâmpada');
  if(r==='aborted'){S.settings.lastBackup=prev;return;}
  render();toast(r==='shared'?'Backup enviado. Confira se ele ficou no Google Drive.':'Backup salvo em Downloads. Envie o arquivo para o Google Drive.');
}
async function onBakFile(f){
  if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(d&&d.formato==='lampada-biblia'){toast('Este arquivo é uma Bíblia. Use Importar Bíblia.');return;}
    const s=d&&d.formato==='lampada-backup'?d.dados:null;
    if(!s||s.v!==1||!Array.isArray(s.plans)||!Array.isArray(s.reads)){toast('O arquivo não é um backup do Lâmpada.');return;}
    const when=d.geradoEm?fmtL(dk(new Date(d.geradoEm))):'data desconhecida',nn=(s.notes||[]).length;
    sheet({t:'conf',title:'Restaurar este backup?',text:`Backup de ${when}: ${s.plans.length} ${pl(s.plans.length,'plano','planos')}, ${s.reads.length} ${pl(s.reads.length,'leitura registrada','leituras registradas')} e ${nn} ${pl(nn,'nota','notas')}. Os dados atuais deste celular serão substituídos.`,ok:'Restaurar',
      fn:()=>{S=fixState(s);if(!hasVer(S.settings.version))S.settings.version=okVer(...VORD);HIST=[];R={v:'hoje',tab:'hoje'};render();toast('Backup restaurado');}});
  }catch(e){toast('Não consegui ler o arquivo de backup.');}
}

/* ---------------- eventos ---------------- */
$('#in-bib').addEventListener('change',e=>onBibFiles([...e.target.files]));
$('#in-bak').addEventListener('change',e=>onBakFile(e.target.files&&e.target.files[0]));
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=A[t.dataset.a];if(f){e.preventDefault();f(t.dataset,t,e);}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.v[data-a]')){e.preventDefault();A.tapVerse(e.target.dataset);}if(e.key==='Escape'&&SHEET&&SHEET.t!=='fech'){sheet(null);}});
document.addEventListener('input',e=>{const t=e.target;const k=t.dataset.in;if(!k)return;
  if(k==='nvq'){NV.q=t.value;const pos=t.selectionStart;render();const n=$('#nv-q');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}return;}
  if(k==='wpaste'){W.paste=t.value;return;}
  if(k==='wname'){W.name=t.value;W.nameEdited=true;const sb=document.querySelector('.sumbar .sb b');if(sb)sb.textContent=t.value;return;}
  if(k==='pcnome'){R.pc.nome=t.value;drawCard();return;}
});
document.addEventListener('change',e=>{const t=e.target;const k=t.dataset.in;if(!k)return;
  if(k==='reminder'){S.settings.reminder=t.value;save();toast('Lembrete ajustado');return;}
  if(k==='wn'){W.dur.n=Math.max(1,+t.value||1);W.nameEdited=W.nameEdited;W.model=W.model&&MODELS.find(m=>m.id===W.model).dur.n===W.dur.n?W.model:null;render();return;}
  if(k==='wu'){W.dur.u=t.value;W.model=null;render();return;}
  if(k==='wrn'){W.dur.rn=Math.max(1,+t.value||1);W.model=null;render();return;}
  if(k==='wru'){W.dur.ru=t.value;render();return;}
  if(k==='wstart'){if(t.value)W.start=t.value;W.rests=[];render();return;}
  if(k==='wrem'){W.reminder=t.value;return;}
  if(k==='wv1'||k==='wv2'){const b=+t.dataset.b,c=+t.dataset.c;const e2=W.sel.get(b);const cur=e2.rng.get(c)||[1,nV(b,c)];let v=Math.min(nV(b,c),Math.max(1,+t.value||1));if(k==='wv1')cur[0]=v;else cur[1]=v;if(cur[0]>cur[1])cur.reverse();if(cur[0]===1&&cur[1]===nV(b,c))e2.rng.delete(c);else e2.rng.set(c,cur);render();return;}
  if(k==='edfile'){const f=t.files&&t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{PHOTO=img;R.ed.tpl='foto';R.ed.color='#FFFFFF';render();};img.src=rd.result;};rd.readAsDataURL(f);return;}
});

/* O app instalado pode ficar dias aberto em segundo plano: confere a data ao voltar e a cada minuto. */
function checkDay(){const h=dk(new Date());if(h===TODAY)return;const old=TODAY;TODAY=h;if(W&&W.start===old)W.start=h;refresh();}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay();});
window.addEventListener('pageshow',checkDay);
window.addEventListener('focus',checkDay);
setInterval(checkDay,60000);

S=load();
(async()=>{
  await bibInit();
  if(!hasVer(S.settings.version)&&BIB.list.length)S.settings.version=okVer(...VORD);
  render();
  await storageInfo();if(R.v==='ajustes')refresh();
})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
</script>
